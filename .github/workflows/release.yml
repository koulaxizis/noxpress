# Δημοσιεύει GitHub releases για τα plugins του noxpress.
#
# Πότε τρέχει:
#  - push στο main που αλλάζει κάτι στο plugins/ → για κάθε plugin της
#    λίστας AUTO, αν δεν υπάρχει ακόμα release για την έκδοση του header
#    του, το φτιάχνει (ανέβασε το Version: και κάνε merge — τίποτα άλλο).
#  - push tag nox-<code>-<version> (π.χ. nox-rs-1.7.0) → μόνο αυτό.
#  - χειροκίνητα από Actions → «Release plugin» → Run workflow.
#
#   rs → revenue-splitter   sp → store-pulse
#   sf → smart-formatter    tp → theme-patcher
#   nm → data-migrator (μόνο με tag)
#
# Το zip περιέχει τον φάκελο του plugin στη ρίζα (<slug>/...) και
# ανεβαίνει ως <slug>.zip — αυτό το URL χρησιμοποιεί το noxpress.tech.
# Οι εκδόσεις βγαίνουν ως pre-release (beta)· όταν δοκιμαστούν,
# αφαιρείς το «pre-release» από τη σελίδα του release στο GitHub.
#
# updates.json (Bible §16): μετά από κάθε release, και κάθε φορά που
# αλλάζεις ένα release στο GitHub (π.χ. βγάζεις το «pre-release»), το job
# «manifest» ξαναφτιάχνει το updates.json στη ρίζα του main. Από εκεί το
# διαβάζουν τα sites (https://noxpress.tech/updates.json): για κάθε plugin
# το νεότερο stable και το νεότερο beta, με sha256 και υπογραφή Ed25519.
# Χρειάζεται το secret NOXPRESS_SIGNING_KEY (ιδιωτικό κλειδί PEM)· χωρίς
# αυτό το workflow σταματά πριν βγάλει οτιδήποτε.
name: Release plugin

on:
  push:
    branches: [main]
    paths: ['plugins/**', '.github/workflows/release.yml', '.github/scripts/**']
    tags: ['nox-*-*']
  release:
    types: [published, edited, prereleased, released, unpublished, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

env:
  AUTO: 'rs sp sf tp'

jobs:
  release:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing key
        env:
          NOXPRESS_SIGNING_KEY: ${{ secrets.NOXPRESS_SIGNING_KEY }}
        run: |
          if [ -z "$NOXPRESS_SIGNING_KEY" ]; then
            echo "::error::The NOXPRESS_SIGNING_KEY secret is missing: add it in Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - name: Check Noxpress Core copies
        run: |
          set -euo pipefail
          ref=plugins/revenue-splitter/includes/noxpress-core
          for slug in store-pulse smart-formatter theme-patcher; do
            if ! diff -r "$ref" "plugins/$slug/includes/noxpress-core" > /dev/null; then
              echo "::error::plugins/$slug/includes/noxpress-core differs from Revenue Splitter's copy: run .github/scripts/sync-core.sh"
              exit 1
            fi
          done

      - name: Build and publish missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          slug_of() {
            case "$1" in
              rs) echo revenue-splitter ;;
              sp) echo store-pulse ;;
              sf) echo smart-formatter ;;
              tp) echo theme-patcher ;;
              nm) echo data-migrator ;;
              *) return 1 ;;
            esac
          }
          name_of() {
            case "$1" in
              rs) echo "Revenue Splitter" ;;
              sp) echo "Store Pulse" ;;
              sf) echo "Smart Formatter" ;;
              tp) echo "Theme Patcher" ;;
              nm) echo "Data Migrator" ;;
            esac
          }
          header_version() {
            grep -m1 -E '^\s*\*\s*Version:' "plugins/$1/$1.php" \
              | sed -E 's/.*Version:\s*//; s/\s+$//'
          }

          release_one() {
            local code="$1" slug name version tag
            slug="$(slug_of "$code")" || { echo "::error::Unknown plugin code '$code'"; exit 1; }
            name="$(name_of "$code")"
            version="$(header_version "$slug")"
            tag="nox-${code}-${version}"

            if [ -n "${2:-}" ] && [ "$2" != "$version" ]; then
              echo "::error::Tag version $2 does not match plugin header $version ($slug)"
              exit 1
            fi
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "$tag already released — skipping."
              return 0
            fi

            echo "::group::$tag"
            find "plugins/$slug" -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

            rm -f "$slug.zip"
            (cd plugins && zip -qrX "../$slug.zip" "$slug" -x '*.DS_Store')

            {
              echo "**Beta**: under testing before it is marked stable."
              echo
              echo "Requires WordPress 6.0+, PHP 7.4+ and WooCommerce."
              echo
              echo "### Changes"
              if [ -f "plugins/$slug/readme.txt" ]; then
                awk -v v="= $version =" '$0==v{f=1;next} /^= /{f=0} f' "plugins/$slug/readme.txt"
              fi
            } > notes.md

            gh release create "$tag" "$slug.zip" \
              --target "$GITHUB_SHA" \
              --title "$name $version (beta)" \
              --notes-file notes.md \
              --prerelease
            echo "::endgroup::"
          }

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            code="$(echo "$GITHUB_REF_NAME" | cut -d- -f2)"
            release_one "$code" "${GITHUB_REF_NAME#nox-${code}-}"
          else
            for code in $AUTO; do
              release_one "$code"
            done
          fi

  manifest:
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Build and push updates.json
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.NOXPRESS_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::The NOXPRESS_SIGNING_KEY secret is missing."
            exit 1
          fi
          key="$RUNNER_TEMP/noxpress-signing.pem"
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          NOXPRESS_SIGNING_KEY="$key" python3 .github/scripts/build-manifest.py updates.json $AUTO
          rm -f "$key"

          if git diff --quiet -- updates.json && git ls-files --error-unmatch updates.json > /dev/null 2>&1; then
            echo "updates.json unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates.json
          git commit -m 'Update updates.json'
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 4))
            git pull --rebase origin main
          done
          echo "::error::Could not push updates.json"
          exit 1
