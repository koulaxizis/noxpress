# Χτίζει το zip ενός plugin και δημοσιεύει GitHub release όταν γίνεται
# push ένα tag της μορφής nox-<code>-<version> (π.χ. nox-rs-1.7.0).
#
#   rs → revenue-splitter   sp → store-pulse
#   sf → smart-formatter    nm → data-migrator
#
# Το zip περιέχει τον φάκελο του plugin στη ρίζα (<slug>/...) και
# ανεβαίνει ως <slug>.zip — αυτό το URL χρησιμοποιεί το noxpress.tech.
# Οι εκδόσεις βγαίνουν ως pre-release (beta)· όταν δοκιμαστούν,
# αφαιρείς το «pre-release» από τη σελίδα του release στο GitHub.
name: Release plugin

on:
  push:
    tags:
      - 'nox-*-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve plugin from tag
        id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          code="$(echo "$tag" | cut -d- -f2)"
          version="${tag#nox-${code}-}"
          case "$code" in
            rs) slug=revenue-splitter; name="Revenue Splitter" ;;
            sp) slug=store-pulse;      name="Store Pulse" ;;
            sf) slug=smart-formatter;  name="Smart Formatter" ;;
            nm) slug=data-migrator;    name="Data Migrator" ;;
            *) echo "::error::Unknown plugin code '$code' in tag $tag"; exit 1 ;;
          esac
          main="plugins/$slug/$slug.php"
          header="$(grep -m1 -E '^\s*\*\s*Version:' "$main" | sed -E 's/.*Version:\s*//; s/\s+$//')"
          if [ "$header" != "$version" ]; then
            echo "::error::Tag version $version does not match plugin header $header ($main)"
            exit 1
          fi
          {
            echo "slug=$slug"
            echo "name=$name"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Lint PHP
        run: |
          find "plugins/${{ steps.meta.outputs.slug }}" -name '*.php' -print0 \
            | xargs -0 -n1 php -l > /dev/null

      - name: Build zip
        run: |
          cd plugins
          zip -qrX "../${{ steps.meta.outputs.slug }}.zip" "${{ steps.meta.outputs.slug }}" -x '*.DS_Store'

      - name: Release notes from readme.txt
        run: |
          readme="plugins/${{ steps.meta.outputs.slug }}/readme.txt"
          {
            echo "**Beta**: under testing before it is marked stable."
            echo
            echo "Requires WordPress 6.0+, PHP 7.4+ and WooCommerce."
            echo
            echo "### Changes"
            if [ -f "$readme" ]; then
              awk -v v="= ${{ steps.meta.outputs.version }} =" \
                '$0==v{f=1;next} /^= /{f=0} f' "$readme"
            fi
          } > notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.meta.outputs.slug }}.zip" \
            --title "${{ steps.meta.outputs.name }} ${{ steps.meta.outputs.version }} (beta)" \
            --notes-file notes.md \
            --prerelease \
            --verify-tag
