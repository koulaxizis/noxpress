# Δημοσιεύει GitHub releases για τα plugins του noxpress.
#
# Πότε τρέχει:
#  - push στο main που αλλάζει κάτι στο plugins/ → για κάθε plugin της
#    λίστας AUTO, αν δεν υπάρχει ακόμα release για την έκδοση του header
#    του, το φτιάχνει (ανέβασε το Version: και κάνε merge — τίποτα άλλο).
#  - push tag nox-<code>-<version> (π.χ. nox-rs-1.7.0) → μόνο αυτό.
#  - χειροκίνητα από Actions → «Release plugin» → Run workflow.
#
#   rs → revenue-splitter   sp → store-pulse
#   sf → smart-formatter    tp → theme-patcher
#   nm → data-migrator (μόνο με tag)
#
# Το zip περιέχει τον φάκελο του plugin στη ρίζα (<slug>/...) και
# ανεβαίνει ως <slug>.zip — αυτό το URL χρησιμοποιεί το noxpress.tech.
# Οι εκδόσεις βγαίνουν ως pre-release (beta)· όταν δοκιμαστούν,
# αφαιρείς το «pre-release» από τη σελίδα του release στο GitHub.
name: Release plugin

on:
  push:
    branches: [main]
    paths: ['plugins/**', '.github/workflows/release.yml']
    tags: ['nox-*-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

env:
  AUTO: 'rs sp sf tp'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and publish missing releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          slug_of() {
            case "$1" in
              rs) echo revenue-splitter ;;
              sp) echo store-pulse ;;
              sf) echo smart-formatter ;;
              tp) echo theme-patcher ;;
              nm) echo data-migrator ;;
              *) return 1 ;;
            esac
          }
          name_of() {
            case "$1" in
              rs) echo "Revenue Splitter" ;;
              sp) echo "Store Pulse" ;;
              sf) echo "Smart Formatter" ;;
              tp) echo "Theme Patcher" ;;
              nm) echo "Data Migrator" ;;
            esac
          }
          header_version() {
            grep -m1 -E '^\s*\*\s*Version:' "plugins/$1/$1.php" \
              | sed -E 's/.*Version:\s*//; s/\s+$//'
          }

          release_one() {
            local code="$1" slug name version tag
            slug="$(slug_of "$code")" || { echo "::error::Unknown plugin code '$code'"; exit 1; }
            name="$(name_of "$code")"
            version="$(header_version "$slug")"
            tag="nox-${code}-${version}"

            if [ -n "${2:-}" ] && [ "$2" != "$version" ]; then
              echo "::error::Tag version $2 does not match plugin header $version ($slug)"
              exit 1
            fi
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "$tag already released — skipping."
              return 0
            fi

            echo "::group::$tag"
            find "plugins/$slug" -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

            rm -f "$slug.zip"
            (cd plugins && zip -qrX "../$slug.zip" "$slug" -x '*.DS_Store')

            {
              echo "**Beta**: under testing before it is marked stable."
              echo
              echo "Requires WordPress 6.0+, PHP 7.4+ and WooCommerce."
              echo
              echo "### Changes"
              if [ -f "plugins/$slug/readme.txt" ]; then
                awk -v v="= $version =" '$0==v{f=1;next} /^= /{f=0} f' "plugins/$slug/readme.txt"
              fi
            } > notes.md

            gh release create "$tag" "$slug.zip" \
              --target "$GITHUB_SHA" \
              --title "$name $version (beta)" \
              --notes-file notes.md \
              --prerelease
            echo "::endgroup::"
          }

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            code="$(echo "$GITHUB_REF_NAME" | cut -d- -f2)"
            release_one "$code" "${GITHUB_REF_NAME#nox-${code}-}"
          else
            for code in $AUTO; do
              release_one "$code"
            done
          fi
