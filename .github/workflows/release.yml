name: Release → Updates Hub

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      regenerate_index_only:
        description: 'Only rebuild index.json (no release)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: updates-hub
  cancel-in-progress: false

jobs:
  publish-updates:
    runs-on: ubuntu-latest
    env:
      # ← Το branch που σερβίρει το GitHub Pages (άλλαξέ το αν είναι π.χ. gh-pages)
      PAGES_BRANCH: main
    steps:
      - name: Checkout Pages branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PAGES_BRANCH }}

      - name: Publish release JSON(s) + rebuild index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          BODY: ${{ github.event.release.body }}
          REGEN_ONLY: ${{ github.event.inputs.regenerate_index_only == 'true' }}
        run: |
          set -euo pipefail

          mkdir -p updates

          # ---------- 1) Γράφουμε updates/<slug>.json για κάθε zip asset ----------
          if [ "$REGEN_ONLY" != "true" ]; then
            # Tag cleanup: 'v1.2.0' -> '1.2.0'
            VERSION="${TAG#v}"

            # Changelog σε single-line JSON string (wp_kses_post-compatible HTML/thumb)
            CHANGELOG=$(printf '%s' "$BODY" | jq -Rs .)

            # Σημείωση: με tail -n +2 διαβάζουμε ΟΛΑ τα assets (not just first page)
            ASSET_URLS=$(gh api "repos/${REPO}/releases/tags/${TAG}" \
              --paginate \
              --jq '.assets[] | select(.name | endswith(".zip")) | [.name, .browser_download_url] | @tsv')

            if [ -z "$ASSET_URLS" ]; then
              echo "::warning::No .zip assets found on release ${TAG}"
            fi

            echo "$ASSET_URLS" | while IFS=$'\t' read -r NAME URL; do
              [ -z "${NAME:-}" ] && continue
              SLUG="${NAME%.zip}"
              echo "Publishing updates/${SLUG}.json (v${VERSION})"

              jq -n \
                --arg v "$VERSION" \
                --arg d "$URL" \
                --arg u "https://github.com/${REPO}/releases/tag/${TAG}" \
                --argjson c "$CHANGELOG" \
                '{version: $v, download_url: $d, details_url: $u, changelog: $c}' \
                > "updates/${SLUG}.json"

              jq . "updates/${SLUG}.json" >/dev/null  # sanity: valid JSON
            done
          fi

          # ---------- 2) Ξαναχτίζουμε το index.json από ΟΛΑ τα plugins ----------
          {
            printf '{"updated":"%s","plugins":[' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            FIRST=1
            for f in updates/*.json; do
              [ "$f" = "updates/index.json" ] && continue
              jq -r \
                --arg url "https://koulaxizis.github.io/noxpress/${f#./}" \
                '[.version] as [$v] | input_filename as $f |
                 ($f | sub("updates/";"") | sub("\\.json$";"")) as $slug |
                 ({slug: $slug, version: $v, json: $url} | tostring)' "$f" \
                | sed 's/^/   /'
            done | paste -sd ',' -
            printf ']}\n'
          } > updates/index.json.tmp

          jq . updates/index.json.tmp > updates/index.json 2>/dev/null \
            || cp updates/index.json.tmp updates/index.json
          rm -f updates/index.json.tmp

          # Sanity στο τελικό index
          jq -e '.plugins | length >= 1' updates/index.json >/dev/null

      - name: Commit & push
        run: |
          git config user.name  "release-updater-bot"
          git config user.email "actions@users.noreply.github.com"
          git add updates/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "updates: sync from release ${GITHUB_REF_NAME:-manual}"
          git push origin "$PAGES_BRANCH"