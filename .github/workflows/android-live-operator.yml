# Χτίζει την εφαρμογή Android του Live Operator (apps/live-operator-android),
# με το κοινό workflow android-app.yml.
#
# Πότε τρέχει:
#  - pull request που αλλάζει την εφαρμογή → unit tests, lint και debug APK
#    ως artifact του run (για δοκιμή στο κινητό πριν από το merge). Νέο push
#    στο ίδιο PR ακυρώνει το προηγούμενο run.
#  - push στο main που αλλάζει την εφαρμογή → αν δεν υπάρχει ακόμα release
#    nox-loa-<versionName>, unit tests και υπογεγραμμένο live-operator.apk ως
#    pre-release (beta). Ανέβασε το versionName (και το versionCode) στο
#    app/build.gradle.kts και κάνε merge — τίποτα άλλο.
#  - χειροκίνητα → build, και στο main και release.
#
# Υπογραφή με τα ίδια secrets με την εφαρμογή του Site Bridge (SBA_*), ώστε
# ένα αποτύπωμα πιστοποιητικού να ισχύει και για τις δύο. Χωρίς αυτά το job
# «release» σταματά με μήνυμα· το debug APK βγαίνει πάντα.
#
# Τα κείμενα του F-Droid (fdroid/) δεν χτίζουν την εφαρμογή: τα δημοσιεύει το
# fdroid.yml.
#
# Το tag nox-loa-* δεν είναι plugin: το release.yml και το updates.json το
# αγνοούν (κανένας κωδικός plugin δεν είναι τριών γραμμάτων).
name: Android app (Live Operator)

on:
  pull_request:
    paths: ['apps/live-operator-android/**', '!apps/live-operator-android/fdroid/**', '.github/workflows/android-live-operator.yml', '.github/workflows/android-app.yml']
  push:
    branches: [main]
    paths: ['apps/live-operator-android/**', '!apps/live-operator-android/fdroid/**', '.github/workflows/android-live-operator.yml', '.github/workflows/android-app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-live-operator-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    permissions:
      contents: write
    uses: ./.github/workflows/android-app.yml
    with:
      app: live-operator-android
      apk: live-operator
      tag_prefix: nox-loa
      title: Live Operator app
      requires: Android 9+ with Chrome. One app for every site (2.0.0+); needs the Live Operator plugin on the site, and 1.4.0+ lists the app by itself.
      cert_hint: Live Operator 1.4.0+ serves it by itself; for older versions paste it in Noxpress → Live Operator → Android app
    secrets:
      SBA_KEYSTORE_B64: ${{ secrets.SBA_KEYSTORE_B64 }}
      SBA_KEYSTORE_PASSWORD: ${{ secrets.SBA_KEYSTORE_PASSWORD }}
      SBA_KEY_ALIAS: ${{ secrets.SBA_KEY_ALIAS }}
      SBA_KEY_PASSWORD: ${{ secrets.SBA_KEY_PASSWORD }}
