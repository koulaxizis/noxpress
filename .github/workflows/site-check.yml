# Ελέγχει ότι κάθε κάρτα του noxpress.tech δείχνει την έκδοση του header του
# plugin (meta, link λήψης, `{p}_download` EN/EL) και έχει το βίντεό της
# (Bible §13), και ότι τα inline scripts των σελίδων περνούν το `node --check`
# (Bible §17). Ελέγχει και τις κάρτες των εφαρμογών Android (versionName).
# Τρέχει σε κάθε PR που αγγίζει το site ή τα plugins.
name: Site cards

on:
  pull_request:
    paths:
      - 'index.html'
      - 'supporters/index.html'
      - 'plugins/**'
      - 'apps/*/app/build.gradle.kts'
      - 'media/videos/**'
      - '.github/scripts/check-site-*.py'
      - '.github/workflows/site-check.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-cards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check plugin cards
        run: python3 .github/scripts/check-site-cards.py
      - name: Check inline scripts
        run: python3 .github/scripts/check-site-js.py
