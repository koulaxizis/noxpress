# Κοινό workflow για τις εφαρμογές Android του repo (apps/<όνομα>-android).
# Δεν τρέχει μόνο του: το καλούν το android.yml (Site Bridge) και το
# android-live-operator.yml (Live Operator), που ορίζουν πότε τρέχει.
#
#  - build (pull request ή χειροκίνητα): unit tests, lint και debug APK ως
#    artifact του run, για δοκιμή στο κινητό πριν από το merge.
#  - release (push στο main ή χειροκίνητα στο main): αν δεν υπάρχει ακόμα
#    release <tag_prefix>-<versionName>, τρέχει τα unit tests, βγάζει
#    υπογεγραμμένο <apk>.apk και το δημοσιεύει ως pre-release (beta). Στο
#    push δεν ξανατρέχει το build: έτρεξε ήδη στο PR.
#
# Υπογραφή με τα secrets SBA_* (ίδιο keystore για όλες τις εφαρμογές). Χωρίς
# αυτά το release σταματά με μήνυμα· το debug APK βγαίνει πάντα.
name: Android app (shared)

on:
  workflow_call:
    inputs:
      app:
        description: Folder under apps/ (e.g. site-bridge-android)
        type: string
        required: true
      apk:
        description: APK base name (e.g. site-bridge)
        type: string
        required: true
      tag_prefix:
        description: Release tag prefix, three letters after nox- (e.g. nox-sba)
        type: string
        required: true
      title:
        description: Release title prefix, matched by the Obtainium filter (e.g. Site Bridge app)
        type: string
        required: true
      requires:
        description: Requirements line of the release notes
        type: string
        required: true
      cert_hint:
        description: Optional text after "Signing certificate SHA-256" in the notes
        type: string
        default: ''
    secrets:
      SBA_KEYSTORE_B64:
        required: false
      SBA_KEYSTORE_PASSWORD:
        required: false
      SBA_KEY_ALIAS:
        required: false
      SBA_KEY_PASSWORD:
        required: false

jobs:
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Unit tests, lint, debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Rename debug APK and print its certificate
        env:
          APK: ${{ inputs.apk }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk "$APK-debug.apk"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          cert="$("$apksigner" verify --print-certs "$APK-debug.apk" | grep -m1 'SHA-256 digest' | sed -E 's/.*: //' | tr 'a-f' 'A-F' | sed -E 's/(..)/\1:/g; s/:$//')"
          {
            echo "### Debug APK"
            echo
            echo "Debug signing certificate SHA-256 (for a test build only):"
            echo
            echo "\`$cert\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.apk }}-debug-apk
          path: apps/${{ inputs.app }}/${{ inputs.apk }}-debug.apk
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ${{ inputs.apk }}-reports
          path: |
            apps/${{ inputs.app }}/app/build/reports/
            apps/${{ inputs.app }}/app/build/test-results/
          retention-days: 7

  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        working-directory: apps/${{ inputs.app }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Version and tag
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail
          version="$(grep -m1 -E 'versionName\s*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')"
          if ! echo "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::versionName '$version' is not semver"
            exit 1
          fi
          tag="$TAG_PREFIX-$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag already released — skipping."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          else
            echo "skip=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets
        if: steps.v.outputs.skip == '0'
        env:
          SBA_KEYSTORE_B64: ${{ secrets.SBA_KEYSTORE_B64 }}
          SBA_KEYSTORE_PASSWORD: ${{ secrets.SBA_KEYSTORE_PASSWORD }}
          SBA_KEY_ALIAS: ${{ secrets.SBA_KEY_ALIAS }}
          SBA_KEY_PASSWORD: ${{ secrets.SBA_KEY_PASSWORD }}
        run: |
          if [ -z "$SBA_KEYSTORE_B64" ] || [ -z "$SBA_KEYSTORE_PASSWORD" ] || [ -z "$SBA_KEY_ALIAS" ] || [ -z "$SBA_KEY_PASSWORD" ]; then
            echo "::error::The app signing secrets are missing (SBA_KEYSTORE_B64, SBA_KEYSTORE_PASSWORD, SBA_KEY_ALIAS, SBA_KEY_PASSWORD): add them in Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.v.outputs.skip == '0'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: steps.v.outputs.skip == '0'

      - name: Unit tests, signed APK and publish
        if: steps.v.outputs.skip == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          SBA_KEYSTORE_B64: ${{ secrets.SBA_KEYSTORE_B64 }}
          SBA_KEYSTORE_PASSWORD: ${{ secrets.SBA_KEYSTORE_PASSWORD }}
          SBA_KEY_ALIAS: ${{ secrets.SBA_KEY_ALIAS }}
          SBA_KEY_PASSWORD: ${{ secrets.SBA_KEY_PASSWORD }}
          APK: ${{ inputs.apk }}
          TITLE: ${{ inputs.title }}
          REQUIRES: ${{ inputs.requires }}
          CERT_HINT: ${{ inputs.cert_hint }}
          VERSION: ${{ steps.v.outputs.version }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          set -euo pipefail
          export SBA_KEYSTORE_FILE="$RUNNER_TEMP/sba.jks"
          trap 'rm -f "$SBA_KEYSTORE_FILE"' EXIT
          echo "$SBA_KEYSTORE_B64" | base64 -d > "$SBA_KEYSTORE_FILE"
          ./gradlew --no-daemon testDebugUnitTest assembleRelease
          rm -f "$SBA_KEYSTORE_FILE"

          cp app/build/outputs/apk/release/app-release.apk "$APK.apk"
          sha256sum "$APK.apk" | cut -d' ' -f1 > "$APK.apk.sha256"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify "$APK.apk"
          cert="$("$apksigner" verify --print-certs "$APK.apk" | grep -m1 'SHA-256 digest' | sed -E 's/.*: //' | tr 'a-f' 'A-F' | sed -E 's/(..)/\1:/g; s/:$//')"

          {
            echo "**Beta**: under testing before it is marked stable."
            echo
            echo "$REQUIRES"
            echo
            echo "- APK SHA-256: \`$(cat "$APK.apk.sha256")\`"
            if [ -n "$CERT_HINT" ]; then
              echo "- Signing certificate SHA-256 ($CERT_HINT):"
            else
              echo "- Signing certificate SHA-256:"
            fi
            echo
            echo "  \`$cert\`"
            echo
            echo "### Changes"
            awk -v v="## $VERSION" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md
          } > notes.md

          gh release create "$TAG" "$APK.apk" "$APK.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "$TITLE $VERSION (beta)" \
            --notes-file notes.md \
            --prerelease
