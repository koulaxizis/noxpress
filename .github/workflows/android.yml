# Χτίζει την εφαρμογή Android του Site Bridge (apps/site-bridge-android),
# με το κοινό workflow android-app.yml.
#
# Πότε τρέχει:
#  - pull request που αλλάζει την εφαρμογή → unit tests, lint και debug APK
#    ως artifact του run (για δοκιμή στο κινητό πριν από το merge). Νέο push
#    στο ίδιο PR ακυρώνει το προηγούμενο run.
#  - push στο main που αλλάζει την εφαρμογή → αν δεν υπάρχει ακόμα release
#    nox-sba-<versionName>, unit tests και υπογεγραμμένο site-bridge.apk ως
#    pre-release (beta). Ανέβασε το versionName (και το versionCode) στο
#    app/build.gradle.kts και κάνε merge — τίποτα άλλο.
#  - χειροκίνητα → build, και στο main και release.
#
# Το release χρειάζεται τα secrets (Settings → Secrets and variables →
# Actions):
#   SBA_KEYSTORE_B64       το keystore σε base64 (base64 -w0 site-bridge.jks)
#   SBA_KEYSTORE_PASSWORD  ο κωδικός του keystore
#   SBA_KEY_ALIAS          το alias του κλειδιού
#   SBA_KEY_PASSWORD       ο κωδικός του κλειδιού
# Χωρίς αυτά το job «release» σταματά με μήνυμα· το debug APK βγαίνει πάντα.
# Το ίδιο κλειδί πρέπει να υπογράφει κάθε έκδοση: αν χαθεί, το Android δεν
# δέχεται ενημέρωση πάνω από την παλιά εφαρμογή.
#
# Το tag nox-sba-* δεν είναι plugin: το release.yml και το updates.json το
# αγνοούν (κανένας κωδικός plugin δεν είναι «sba»).
name: Android app

on:
  pull_request:
    paths: ['apps/site-bridge-android/**', '.github/workflows/android.yml', '.github/workflows/android-app.yml']
  push:
    branches: [main]
    paths: ['apps/site-bridge-android/**', '.github/workflows/android.yml', '.github/workflows/android-app.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    permissions:
      contents: write
    uses: ./.github/workflows/android-app.yml
    with:
      app: site-bridge-android
      apk: site-bridge
      tag_prefix: nox-sba
      title: Site Bridge app
      requires: Android 9+. Needs a Hub with Site Bridge 1.6.0+ and the App tab switched on.
    secrets:
      SBA_KEYSTORE_B64: ${{ secrets.SBA_KEYSTORE_B64 }}
      SBA_KEYSTORE_PASSWORD: ${{ secrets.SBA_KEYSTORE_PASSWORD }}
      SBA_KEY_ALIAS: ${{ secrets.SBA_KEY_ALIAS }}
      SBA_KEY_PASSWORD: ${{ secrets.SBA_KEY_PASSWORD }}
